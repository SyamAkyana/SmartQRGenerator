version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartqr
      POSTGRES_PASSWORD: smartqr_dev_password
      POSTGRES_DB: smartqr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
